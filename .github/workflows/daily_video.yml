# ============================================================================
#  Daily faceless short - full pipeline on GitHub's servers (no local PC)
#
#  Every day at 15:00 UTC (3:00 PM UTC) GitHub spins up an Ubuntu runner:
#    1. checks out this repository
#    2. sets up Python 3.11 + ffmpeg + fonts
#    3. installs moviepy / edge-tts / google-genai / python-dotenv
#    4. runs  python main.py   (Gemini script -> voiceover -> final_short.mp4)
#    5. uploads the finished video as a downloadable artifact
#    6. publishes it to YouTube Shorts + Instagram Reels (step3_upload.py):
#         - YouTube via YouTube Data API v3 with a saved OAuth 2.0 refresh
#           token (no browser login - see tools/yt_refresh_token.py)
#         - Instagram Reels via instagrapi
#         - title + hashtags auto-generated by Gemini, shared by both
#
#  The Gemini key is NEVER stored in the repo - it comes from
#  Settings > Secrets and variables > Actions > GEMINI_API_KEY (see README).
#
#  Timing notes:
#  - Cron is in UTC. 3:00 PM UTC = 8:30 PM IST / 11:00 PM Singapore / 4 PM Paris.
#  - GitHub can delay scheduled runs by a few minutes up to ~30-60 min at peak.
#    This is normal - the job still runs once per day.
#  - Scheduled workflows only run on the DEFAULT branch, and are automatically
#    disabled after 60 days without repo activity (push a commit or re-enable).
#  - You can also trigger a run manually any time: Actions tab > this workflow
#    > "Run workflow" button.
# ============================================================================

name: Daily Short Video

on:
  schedule:
    - cron: '0 15 * * *'        # every day at 15:00 UTC (3:00 PM UTC)
  workflow_dispatch:             # manual "Run workflow" button for testing
    inputs:
      mode:
        description: "Script style (A/B test old vs new per video)"
        type: choice
        options: [beats, classic]
        default: beats
      tts_backend:
        description: "Voiceover backend"
        type: choice
        options: [edge, elevenlabs, playht]
        default: edge
      sfx:
        description: "Cut whoosh + emphasis ding SFX layer"
        type: choice
        options: [on, off]
        default: on
      hook_style:
        description: "Hook beat[0] presentation (title card vs captions)"
        type: choice
        options: [title_card, word_by_word, both]
        default: title_card
      caption_y:
        description: "EXPLICIT caption anchor override (empty = use target_platform preset)"
        type: string
        default: ""
      target_platform:
        description: "Which platform's bottom UI this export must clear"
        type: choice
        options: [generic, youtube, instagram, tiktok]
        default: generic
      safe_zone_guides:
        description: "Draw platform-UI safe-zone guides (DEBUG renders only)"
        type: choice
        options: ["off", "on"]
        default: "off"
      thumbnail_variant:
        description: "Thumbnail variant to auto-attach on upload (others saved for review)"
        type: choice
        options: [hook, midpoint, clean]
        default: hook
      auto_upload_thumbnail:
        description: "Attach the selected thumbnail automatically during upload"
        type: choice
        options: ["true", "false"]
        default: "true"
      topic:
        description: "Optional fixed topic (empty = random from built-in list)"
        type: string
        default: ""
      model_probe:
        description: "DEBUG: only list usable Gemini models, no video is made"
        type: choice
        options: ["off", "on"]
        default: "off"

permissions:
  contents: write               # read repo + commit the footage-reuse tracker

concurrency:
  group: daily-video             # never run two renders at the same time
  cancel-in-progress: true

jobs:
  generate-video:
    runs-on: ubuntu-latest
    timeout-minutes: 40

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip

      - name: Install ffmpeg + caption fonts
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends ffmpeg fonts-dejavu-core

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Pre-flight Gemini probe (fail fast with a clear error)
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          python -u - <<'PY'
          import os, sys
          from step1_generate import resolve_models
          from google import genai
          from google.genai import types
          client = genai.Client(api_key=os.environ["GEMINI_API_KEY"],
                                http_options=types.HttpOptions(timeout=60000))
          last = None
          for model in resolve_models():
              try:
                  r = client.models.generate_content(
                      model=model,
                      contents="Reply with the single word: OK",
                      config=types.GenerateContentConfig(max_output_tokens=5,
                                                         temperature=0))
                  print(f"PROBE OK via {model}: {(r.text or '').strip()}")
                  sys.exit(0)
              except Exception as e:
                  last = e
                  print(f"PROBE {model}: FAILED - {str(e)[:160]}")
          print("ALL MODELS FAILED - last error:", str(last)[:300])
          sys.exit(1)
          PY

      - name: DEBUG Gemini model probe (no video generated)
        if: inputs.model_probe == 'on'
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: python -u step_thumbnail.py --list-models

      - name: Generate the video (script -> voiceover -> final_short.mp4)
        if: inputs.model_probe != 'on'
        env:
          PYTHONUNBUFFERED: "1"
          # REQUIRED secret: Settings > Secrets and variables > Actions
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}

          # OPTIONAL repo Variables (Settings > Secrets and variables > Actions
          # > Variables). Leave unset for sensible defaults:
          #   VIDEO_TOPIC      - fixed topic; empty = random from built-in list
          #   GEMINI_MODEL     - force one model; empty = built-in fallback chain
          #   EDGE_TTS_VOICE   - default en-US-AndrewMultilingualNeural
          #   EDGE_TTS_RATE    - e.g. "+15%" to keep the read near 40 s
          #   BACKGROUND_VIDEO - path to a custom background video in the repo
          VIDEO_TOPIC: ${{ vars.VIDEO_TOPIC }}
          GEMINI_MODEL: ${{ vars.GEMINI_MODEL }}
          EDGE_TTS_VOICE: ${{ vars.EDGE_TTS_VOICE }}
          EDGE_TTS_RATE: ${{ vars.EDGE_TTS_RATE }}
          BACKGROUND_VIDEO: ${{ vars.BACKGROUND_VIDEO }}
          # ---- v2 pipeline flags (A/B test per run via dispatch inputs) ----
          SCRIPT_MODE: ${{ inputs.mode || 'beats' }}          # beats | classic
          TTS_BACKEND: ${{ inputs.tts_backend || 'edge' }}    # edge | elevenlabs | playht
          SFX: ${{ inputs.sfx == 'off' && 'off' || 'auto' }}  # whoosh/ding layer
          HOOK_STYLE: ${{ inputs.hook_style || 'title_card' }}   # title_card | word_by_word | both
          # Platform-aware safe zones (v3): preset picked by target_platform -
          #   youtube 0.52/0.28 | instagram 0.62/0.20 | tiktok 0.60/0.22 | generic 0.58/0.24
          # (anchor / bottom clearance). CAPTION_Y_PCT stays an EXPLICIT override:
          # leave the caption_y input empty to use the platform preset.
          TARGET_PLATFORM: ${{ inputs.target_platform || 'generic' }}
          CAPTION_Y_PCT: ${{ inputs.caption_y || '' }}
          # Optional font-size tuning as a fraction of frame width
          # (set as repo Variables; empty = built-in defaults 0.065 / 0.075)
          CAPTION_FONT_SIZE_PCT: ${{ vars.CAPTION_FONT_SIZE_PCT || '' }}
          TITLE_CARD_FONT_SIZE_PCT: ${{ vars.TITLE_CARD_FONT_SIZE_PCT || '' }}
          RENDER_SAFE_ZONE_GUIDES: ${{ inputs.safe_zone_guides == 'on' && 'on' || 'off' }}
          # ---- thumbnails (step 2.6) ----
          # THUMBNAIL_VARIANT: hook = mid-hook frame + hook text (default),
          #   midpoint = strong mid-video beat + short text, clean = best frame
          # AUTO_UPLOAD_THUMBNAIL=false -> variants are generated and saved as
          #   an artifact for review, but NOT attached at upload time.
          THUMBNAIL_VARIANT: ${{ inputs.thumbnail_variant || 'hook' }}
          AUTO_UPLOAD_THUMBNAIL: ${{ inputs.auto_upload_thumbnail || 'true' }}
          # HOOK_GATE, CURATED_LIB, BEAT_PULSE, MUSIC_DUCKING, HOOK_OVERLAY
          # default to on in the code - set any of them to "off" as a Variable
          # to disable individually.
          # OPTIONAL secret: free key from https://www.pexels.com/api/
          # Enables dynamic backgrounds (one Pexels clip per Gemini
          # search_query, hard-cut at the concept transitions). Without it
          # the run still works - it falls back to the static gradient.
          PEXELS_API_KEY: ${{ secrets.PEXELS_API_KEY }}
        run: python main.py

      - name: Upload final video as artifact
        if: inputs.model_probe != 'on'
        uses: actions/upload-artifact@v4
        with:
          name: final_short_${{ github.run_number }}
          path: |
            output/**/final_short.mp4
            output/**/script.txt
            output/**/word_timings.json
          retention-days: 14
          if-no-files-found: error

      # Thumbnail variants + manifest for review (runs even if the video
      # artifact already succeeded; never blocks publishing)
      - name: Upload thumbnail variants as artifact
        if: inputs.model_probe != 'on'
        uses: actions/upload-artifact@v4
        with:
          name: thumbnails_${{ github.run_number }}
          path: output/**/thumbnails/
          retention-days: 14
          if-no-files-found: ignore

      # ---------------------------------------------------------------------
      # Auto-publish (runs only if the matching secrets exist; each platform
      # is skipped gracefully otherwise, so the job never fails on setup).
      #   YouTube: YT_CLIENT_ID / YT_CLIENT_SECRET / YT_REFRESH_TOKEN
      #            (one-time: python tools/yt_refresh_token.py)
      #   Instagram: IG_SESSION_JSON (best) or IG_SESSIONID, or
      #            IG_USERNAME + IG_PASSWORD as the last resort
      # ---------------------------------------------------------------------
      - name: Publish to YouTube Shorts + Instagram Reels
        if: inputs.model_probe != 'on'
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          YT_CLIENT_ID: ${{ secrets.YT_CLIENT_ID }}
          YT_CLIENT_SECRET: ${{ secrets.YT_CLIENT_SECRET }}
          YT_REFRESH_TOKEN: ${{ secrets.YT_REFRESH_TOKEN }}
          YT_PRIVACY: ${{ vars.YT_PRIVACY }}
          IG_USERNAME: ${{ secrets.IG_USERNAME }}
          IG_PASSWORD: ${{ secrets.IG_PASSWORD }}
          IG_SESSIONID: ${{ secrets.IG_SESSIONID }}
          IG_SESSION_JSON: ${{ secrets.IG_SESSION_JSON }}
          # Official Instagram Content Publishing API (recommended - works
          # from GitHub's datacenter IPs; instagrapi gets 467-blocked there):
          #   IG_ACCESS_TOKEN - long-lived token from your Meta app
          #   IG_USER_ID      - the Instagram professional account id
          # GH_RELEASE_TOKEN is the workflow's own token - used to stage the
          # mp4 on a temporary public Release as the Graph API video_url.
          IG_ACCESS_TOKEN: ${{ secrets.IG_ACCESS_TOKEN }}
          IG_USER_ID: ${{ secrets.IG_USER_ID }}
          GH_RELEASE_TOKEN: ${{ github.token }}
          AUTO_UPLOAD_THUMBNAIL: ${{ inputs.auto_upload_thumbnail || 'true' }}
        run: python step3_upload.py

      # The curated-footage reuse tracker (curated_library/reuse_log.json)
      # is updated by every render so the same clips rotate across videos.
      - name: Commit footage-reuse tracker
        if: success() && inputs.model_probe != 'on'
        run: |
          git config user.name "innerlogic-bot"
          git config user.email "bot@innerlogic.local"
          git add curated_library/reuse_log.json || true
          if git diff --cached --quiet; then
            echo "reuse tracker unchanged"
          else
            git commit -m "chore: update footage reuse tracker [skip ci]"
            git push
          fi
